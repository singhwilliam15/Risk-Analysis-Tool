name: website

# Build the static website (web/) from the engine's output and publish it on GitHub Pages:
# tests → website data (site_data/build.py runs the app on each preset) → Next.js static export → Pages.
# The app fetches the published demo snapshot itself (hash-checked against main), so the presets use the latest prices.
# One-time setup: Settings → Pages → Source: GitHub Actions (docs/deploy.md).
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * 0"  # weekly, Sunday 19:30 IST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Tests (offline)
        run: pytest -q
      - name: Website data (runs the app on each preset)
        run: python site_data/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the site
        working-directory: web
        run: |
          npm ci
          npm run build
          npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
